name: Bennu release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.6.9)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - name: Use real-data Bennu Command Center
        run: cp lib/main_real.dart lib/main.dart
      - name: Allow LAN HTTP for Bennu server
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Prepare Android release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/bennu-${{ env.RELEASE_TAG }}-android.apk"
      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: bennu-android-release
          path: bennu-${{ env.RELEASE_TAG }}-android.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=windows .
      - run: copy lib\main_real.dart lib\main.dart
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:GITHUB_WORKSPACE/bennu-${{ env.RELEASE_TAG }}-windows.zip" -Force
      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: bennu-windows-release
          path: bennu-${{ env.RELEASE_TAG }}-windows.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux Flutter dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter create --platforms=linux .
      - run: cp lib/main_real.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux release
        run: tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/bennu-${{ env.RELEASE_TAG }}-linux-x64.tar.gz" bundle
      - name: Upload Linux release asset
        uses: actions/upload-artifact@v4
        with:
          name: bennu-linux-release
          path: bennu-${{ env.RELEASE_TAG }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [android, windows, linux]
    steps:
      - name: Download Android asset
        uses: actions/download-artifact@v4
        with:
          name: bennu-android-release
          path: release-assets
      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: bennu-windows-release
          path: release-assets
      - name: Download Linux asset
        uses: actions/download-artifact@v4
        with:
          name: bennu-linux-release
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bennu $RELEASE_TAG" \
            --generate-notes \
            release-assets/*
