name: Bennu release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.6.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Prepare Android release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/bennu-${{ env.RELEASE_TAG }}-android.apk"
      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: bennu-android-release
          path: bennu-${{ env.RELEASE_TAG }}-android.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:GITHUB_WORKSPACE/bennu-${{ env.RELEASE_TAG }}-windows.zip" -Force
      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: bennu-windows-release
          path: bennu-${{ env.RELEASE_TAG }}-windows.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - name: Download Android asset
        uses: actions/download-artifact@v4
        with:
          name: bennu-android-release
          path: release-assets
      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: bennu-windows-release
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bennu $RELEASE_TAG" \
            --generate-notes \
            release-assets/*
