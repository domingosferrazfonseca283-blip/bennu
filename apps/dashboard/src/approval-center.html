<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bennu OS — Approval Center</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#18273c,transparent 35%),#06080d}.wrap{max-width:1000px;margin:auto;padding:36px}.back{color:#8ea2bd;text-decoration:none;font-size:12px}.head{margin:20px 0 24px}.ey{font-size:10px;letter-spacing:2px;color:#62e6c8}.head h1{margin:7px 0;font-size:32px}.sub{color:#718096;font-size:11px}.card{background:#0b101a;border:1px solid #182131;border-radius:14px;padding:20px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:9px;color:#718096;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}.value{font-size:12px}.reason{margin-top:18px;padding:13px;background:#080d15;border-radius:9px;color:#a9b5c8;font-size:11px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}button{border:1px solid #2b394e;background:#101826;color:#e8edf7;border-radius:8px;padding:10px 16px;font:11px inherit;cursor:pointer}button.approve{border-color:#286b5f;color:#62e6c8}button.reject{border-color:#6a3942;color:#ff9aa5}.status{font-size:9px;border:1px solid #6a3942;color:#ff9aa5;border-radius:99px;padding:5px 8px;float:right;text-transform:uppercase}.empty{color:#3f4d61;font-size:11px;padding:20px 0}.msg{font-size:11px;margin:10px 0;color:#62e6c8}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:20px}}</style></head><body><div class="wrap"><a class="back" href="./">← Bennu Command Center</a><div class="head"><div class="ey">GOVERNANCE</div><h1>Approval Center</h1><div class="sub">Review agent decisions before they enter the execution pipeline.</div></div><div id="msg" class="msg"></div><div id="list"><div class="empty">Loading approvals...</div></div></div><script>const API=window.BENNU_API||'http://localhost:8000',TOKEN=window.BENNU_TOKEN||'bennu-admin-dev',H={Authorization:`Bearer ${TOKEN}`},$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch(`${API}/api/v1/approvals`,{headers:H});if(!r.ok)throw Error();const d=await r.json(),xs=d.items||[];const pending=xs.filter(x=>x.status==='pending');$('list').innerHTML=pending.length?pending.map(x=>`<article class="card"><span class="status">pending</span><div class="row"><div><div class="label">Agent</div><div class="value">${esc(x.agent_id)}</div></div><div><div class="label">Mission</div><div class="value">${esc(x.mission_id)}</div></div><div><div class="label">Action</div><div class="value">${esc(x.action)}</div></div><div><div class="label">Approval ID</div><div class="value">${esc(x.approval_id)}</div></div></div><div class="reason">${esc(x.reason)}</div><div class="actions"><button class="reject" onclick="review('${esc(x.approval_id)}','rejected')">REJECT</button><button class="approve" onclick="review('${esc(x.approval_id)}','approved')">APPROVE</button></div></article>`).join(''):'<div class="empty">No pending approvals.</div>'}catch(e){$('list').innerHTML='<div class="empty">Approval API offline ou indisponível.</div>'}}async function review(id,decision){const r=await fetch(`${API}/api/v1/approvals/${encodeURIComponent(id)}/review`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({decision})});$('msg').textContent=r.ok?`Approval ${decision}.`:'Review failed.';await load()}load();setInterval(load,5000);</script></body></html>
