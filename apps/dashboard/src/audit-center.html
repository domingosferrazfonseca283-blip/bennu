<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bennu OS — Audit Center</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#18273c,transparent 35%),#06080d}.wrap{max-width:1200px;margin:auto;padding:36px}.back{color:#8ea2bd;text-decoration:none;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 0 24px}.ey{font-size:10px;letter-spacing:2px;color:#62e6c8}.head h1{margin:7px 0;font-size:32px}.live{font-size:10px;color:#62e6c8}.toolbar{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;margin-bottom:14px}input{width:100%;background:#0b101a;border:1px solid #223047;color:#e8edf7;border-radius:9px;padding:11px;font:11px inherit}.panel{background:#0b101a;border:1px solid #182131;border-radius:14px;padding:20px}.event{display:grid;grid-template-columns:170px 130px 1fr 1fr;gap:12px;padding:13px 0;border-top:1px solid #182131;font-size:11px}.action{color:#62e6c8}.muted{color:#718096}.empty{padding:20px 0;color:#3f4d61;font-size:11px}.count{font-size:10px;color:#718096;margin-bottom:10px}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.event{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><a class="back" href="./">← Bennu Command Center</a><div class="head"><div><div class="ey">GOVERNANCE & SECURITY</div><h1>Audit Center</h1></div><div class="live">● LIVE · 5s</div></div><div class="toolbar"><input id="actor" placeholder="Filter actor"><input id="action" placeholder="Filter action"><input id="resource" placeholder="Filter resource"></div><section class="panel"><div id="count" class="count">Loading...</div><div class="event muted"><span>TIME</span><span>ACTION</span><span>ACTOR</span><span>RESOURCE</span></div><div id="events"></div></section></div><script>const API=window.BENNU_API||'http://localhost:8000',TOKEN=window.BENNU_TOKEN||'bennu-admin-dev',H={Authorization:`Bearer ${TOKEN}`},$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];async function load(){try{const r=await fetch(`${API}/api/v1/audit`,{headers:H});if(!r.ok)throw Error();const d=await r.json();all=Array.isArray(d)?d:(d.items||[]);render()}catch(e){$('count').textContent='Core offline ou API indisponível.';$('events').innerHTML=''}}function render(){const a=$('actor').value.toLowerCase(),b=$('action').value.toLowerCase(),c=$('resource').value.toLowerCase(),xs=all.filter(x=>(x.actor||'').toLowerCase().includes(a)&&(x.action||'').toLowerCase().includes(b)&&(x.resource||'').toLowerCase().includes(c));$('count').textContent=`${xs.length} event(s) · ${all.length} total`;$('events').innerHTML=xs.map(x=>`<div class="event"><span class="muted">${esc(x.timestamp)}</span><span class="action">${esc(x.action)}</span><span>${esc(x.actor)}</span><span class="muted">${esc(x.resource)}</span></div>`).join('')||'<div class="empty">No audit events match the filters.</div>'}['actor','action','resource'].forEach(id=>$(id).addEventListener('input',render));load();setInterval(load,5000);</script></body></html>
