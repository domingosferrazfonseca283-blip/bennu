<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bennu OS — Agent Center</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 10%,#18273c,transparent 35%),#06080d}.wrap{max-width:1250px;margin:auto;padding:36px}.back{color:#8ea2bd;text-decoration:none;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin-top:20px}.ey{font-size:10px;letter-spacing:2px;color:#62e6c8}.head h1{margin:7px 0;font-size:32px}.btn,.action{border:1px solid #286b5f;background:#0d1918;color:#62e6c8;padding:10px 14px;border-radius:9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.agent{background:#0b101a;border:1px solid #182131;border-radius:14px;padding:20px}.agent-head{display:flex;justify-content:space-between}.icon{font-size:25px}.name{font-weight:700;margin-top:16px}.role{font-size:11px;color:#718096;margin-top:4px}.status{font-size:10px;color:#62e6c8}.meta{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border-top:1px solid #182131;padding-top:14px}.meta span{font-size:10px;color:#718096}.meta strong{display:block;margin-top:4px;font-size:12px}.actions{margin-top:18px;display:flex;gap:8px}.action{flex:1;border-color:#263244;background:#0d1420;color:#c8d3e5;padding:8px}.panel{margin-top:14px;background:#0b101a;border:1px solid #182131;border-radius:14px;padding:20px}.panel h2{font-size:13px;letter-spacing:1.5px;margin:0 0 14px}.line{display:flex;justify-content:space-between;border-bottom:1px solid #141d2b;padding:12px 0;font-size:12px}.muted{color:#718096}.error{color:#ff9aa5;font-size:12px;margin-top:12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{width:min(420px,90vw);background:#0b101a;border:1px solid #263244;border-radius:14px;padding:22px}.dialog input{width:100%;margin:8px 0 14px;padding:11px;background:#070b12;border:1px solid #263244;color:#fff;border-radius:8px}.dialog .row{display:flex;gap:8px;justify-content:flex-end}.dialog h2{margin-top:0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.wrap{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="./">← Bennu Command Center</a><div class="head"><div><div class="ey">MULTI-AGENT OPERATIONS</div><h1>Agent Center</h1></div><button class="btn" id="new">+ CREATE AGENT</button></div><div id="error" class="error"></div><section class="grid" id="agents"></section><section class="panel"><h2>AGENT POLICY</h2><div class="line"><span>Default autonomy</span><strong>Supervised</strong></div><div class="line"><span>High-risk actions</span><strong class="muted">Approval required</strong></div><div class="line"><span>Execution boundary</span><strong class="muted">Sandboxed tools only</strong></div></section></div><div class="modal" id="modal"><div class="dialog"><h2>Create Agent</h2><input id="name" placeholder="Agent name"><input id="role" placeholder="Role"><div class="row"><button class="action" id="cancel">Cancel</button><button class="btn" id="create">Create</button></div></div></div><script>const API=window.BENNU_API||'http://localhost:8000',TOKEN=window.BENNU_TOKEN||'bennu-admin-dev',H={Authorization:`Bearer ${TOKEN}`,'Content-Type':'application/json'};const $=id=>document.getElementById(id);async function load(){try{const r=await fetch(`${API}/api/v1/agents`,{headers:H});if(!r.ok)throw Error('API error');const list=await r.json();$('agents').innerHTML=list.map(a=>`<article class="agent"><div class="agent-head"><span class="icon">◈</span><span class="status">● ${String(a.status||'ONLINE').toUpperCase()}</span></div><div class="name">${a.name}</div><div class="role">${a.role}</div><div class="meta"><div><span>AUTONOMY</span><strong>${a.autonomous?'Autonomous':'Supervised'}</strong></div><div><span>TOOLS</span><strong>${a.tools_count??0}</strong></div></div><div class="actions"><button class="action">MISSIONS</button><button class="action">CONFIG</button></div></article>`).join('')||'<div class="muted">No agents registered.</div>'}catch(e){$('error').textContent='Core offline, authentication inválida ou endpoint indisponível.'}}$('new').onclick=()=> $('modal').classList.add('show');$('cancel').onclick=()=> $('modal').classList.remove('show');$('create').onclick=async()=>{const name=$('name').value.trim(),role=$('role').value.trim();if(!name||!role)return;const r=await fetch(`${API}/api/v1/agents`,{method:'POST',headers:H,body:JSON.stringify({name,role,autonomous:false})});if(r.ok){$('modal').classList.remove('show');$('name').value='';$('role').value='';load()}else $('error').textContent='Não foi possível criar o agente.'};load();setInterval(load,10000);</script></body></html>
