<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bennu OS — SOC</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#18273c,transparent 35%),#06080d}.wrap{max-width:1200px;margin:auto;padding:36px}.back{color:#8ea2bd;text-decoration:none;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 0 24px}.ey{font-size:10px;letter-spacing:2px;color:#62e6c8}.head h1{margin:7px 0;font-size:32px}.live{font-size:10px;color:#62e6c8}.top{display:grid;grid-template-columns:1.2fr 2fr;gap:14px;margin-bottom:14px}.risk{background:#0b101a;border:1px solid #182131;border-radius:14px;padding:22px}.risk h2,.panel h2{font-size:11px;letter-spacing:1.5px;margin:0 0 14px}.score{font-size:52px;font-weight:700}.level{font-size:11px;color:#62e6c8;text-transform:uppercase;letter-spacing:2px}.bar{height:8px;background:#151e2b;border-radius:99px;overflow:hidden;margin-top:14px}.fill{height:100%;width:0;background:#62e6c8;transition:width .3s}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{background:#0b101a;border:1px solid #182131;border-radius:14px;padding:18px}.stat b{font-size:24px}.stat span{display:block;font-size:9px;color:#718096;margin-top:6px;letter-spacing:1px}.event{display:grid;grid-template-columns:150px 100px 140px 1fr 1.5fr;gap:10px;padding:12px 0;border-top:1px solid #182131;font-size:11px}.sev{font-size:9px;padding:4px 7px;border:1px solid #286b5f;border-radius:99px;width:max-content;color:#62e6c8}.high,.critical{border-color:#6a3942;color:#ff9aa5}.medium{border-color:#8b6c36;color:#e5c778}.muted{color:#718096}.empty{color:#3f4d61;font-size:11px;padding:15px 0}.panel{margin-top:14px}@media(max-width:800px){.top{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:1fr 1fr 1fr}}@media(max-width:500px){.wrap{padding:20px}.stats{grid-template-columns:1fr}.event{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><a class="back" href="./">← Bennu Command Center</a><div class="head"><div><div class="ey">SECURITY OPERATIONS CENTER</div><h1>SOC Dashboard</h1></div><div class="live">● LIVE · 5s</div></div><section class="top"><div class="risk"><h2>RISK SCORE</h2><div id="score" class="score">0</div><div id="level" class="level">NORMAL</div><div class="bar"><div id="fill" class="fill"></div></div></div><div class="stats" id="stats"></div></section><section class="panel"><h2>SECURITY EVENT STREAM</h2><div id="events"><div class="empty">Loading...</div></div></section></div><script>const API=window.BENNU_API||'http://localhost:8000',TOKEN=window.BENNU_TOKEN||'bennu-admin-dev',H={Authorization:`Bearer ${TOKEN}`},$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(path){const r=await fetch(API+path,{headers:H});if(!r.ok)throw Error();return r.json()}async function load(){try{const [o,e,a,i]=await Promise.all([get('/api/v1/soc/overview'),get('/api/v1/soc/events'),get('/api/v1/soc/alerts'),get('/api/v1/soc/incidents')]);const xs=e.items||[];const score=Number(o.latest_risk||0);$('score').textContent=score;$('level').textContent=score>=75?'CRITICAL':score>=50?'HIGH':score>=25?'MEDIUM':'LOW';$('fill').style.width=`${score}%`;const count=s=>xs.filter(x=>String(x.severity).toLowerCase()===s).length;$('stats').innerHTML=[['CRITICAL',count('critical')],['HIGH',count('high')],['OPEN ALERTS',(a.items||[]).filter(x=>x.status==='open').length],['OPEN INCIDENTS',(i.items||[]).filter(x=>x.status==='open').length]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');$('events').innerHTML=xs.slice(-30).reverse().map(x=>`<div class="event"><span class="muted">${esc(x.timestamp)}</span><span class="sev ${esc(String(x.severity).toLowerCase())}">${esc(x.severity)}</span><span>${esc(x.event_type)}</span><span>${esc(x.source)} · ${esc(x.asset)}</span><span>${esc(JSON.stringify(x.metadata||{}))}</span></div>`).join('')||'<div class="empty">No security events.</div>'}catch(e){$('events').innerHTML='<div class="empty">SOC API offline ou indisponível.</div>'}}load();setInterval(load,5000);</script></body></html>
