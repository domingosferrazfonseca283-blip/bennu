<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bennu OS — Mission Detail</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#18273c,transparent 35%),#06080d}.wrap{max-width:1100px;margin:auto;padding:36px}.back{color:#8ea2bd;text-decoration:none;font-size:12px}.head{margin:20px 0}.ey{font-size:10px;letter-spacing:2px;color:#62e6c8}.head h1{font-size:30px;margin:7px 0}.muted{color:#718096}.error{color:#ff9aa5;font-size:12px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.panel{background:#0b101a;border:1px solid #182131;border-radius:14px;padding:20px;margin-bottom:14px}.panel h2{font-size:11px;letter-spacing:1.5px;margin:0 0 15px}.summary{display:flex;justify-content:space-between;gap:20px}.summary strong{font-size:14px}.tag{display:inline-block;font-size:9px;padding:5px 8px;border:1px solid #286b5f;border-radius:99px;color:#62e6c8}.tag.risk,.tag.pending{border-color:#6a3942;color:#ff9aa5}.task{padding:14px 0;border-top:1px solid #182131;display:flex;justify-content:space-between;gap:15px}.task strong{font-size:12px}.task small{display:block;color:#718096;margin-top:5px}.event{font-size:11px;padding:10px 0;border-bottom:1px solid #182131;color:#a9b5c8}.event b{color:#62e6c8}.agent{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid #182131;font-size:11px}.reason{font-size:10px;color:#718096;margin-top:5px}@media(max-width:700px){.grid{grid-template-columns:1fr}.summary{flex-direction:column}.agent{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="mission-board.html">← Mission Board</a><div class="head"><div class="ey">MISSION DETAIL</div><h1 id="title">Loading...</h1><div id="error" class="error"></div></div><div class="grid"><main><section class="panel"><h2>MISSION STATUS</h2><div class="summary"><strong id="status">—</strong><span id="risk" class="tag">—</span></div></section><section class="panel"><h2>TASKS</h2><div id="tasks" class="muted">Loading tasks...</div></section><section class="panel"><h2>AGENT ORCHESTRATION</h2><div id="plan" class="muted">Building orchestration plan...</div></section></main><aside><section class="panel"><h2>EXECUTIONS</h2><div id="exec" class="muted">Loading...</div></section><section class="panel"><h2>AUDIT HISTORY</h2><div id="audit" class="muted">Loading...</div></section></aside></div></div><script>const API=window.BENNU_API||'http://localhost:8000',TOKEN=window.BENNU_TOKEN||'bennu-admin-dev',H={Authorization:`Bearer ${TOKEN}`},id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!id){$('error').textContent='Missing mission id';return}try{const [mr,er,ar]=await Promise.all([fetch(`${API}/api/v1/missions/${encodeURIComponent(id)}`,{headers:H}),fetch(`${API}/api/v1/executions`,{headers:H}),fetch(`${API}/api/v1/audit`,{headers:H})]);if(!mr.ok)throw Error('mission');const m=await mr.json(),e=er.ok?await er.json():{items:[]},a=ar.ok?await ar.json():[];$('title').textContent=m.objective;$('status').textContent=m.status;const high=m.tasks?.some(t=>t.risk==='high');$('risk').textContent=high?'HIGH RISK':'NORMAL';$('risk').className='tag '+(high?'risk':'');$('tasks').innerHTML=(m.tasks||[]).map(t=>`<div class="task"><div><strong>${esc(t.title)}</strong><small>${esc(t.agent_role)} · ${esc(t.risk)} risk</small></div><span class="tag">${esc(t.status)}</span></div>`).join('')||'No tasks';const xs=e.items||e;$('exec').innerHTML=xs.length?xs.map(x=>`<div class="event"><b>${esc(x.task_id)}</b><br>${esc(x.result?.status||x.status||'registered')}</div>`).join(''):'No executions';$('audit').innerHTML=a.slice(0,10).map(x=>`<div class="event"><b>${esc(x.action)}</b> · ${esc(x.actor)}<br><span class="muted">${esc(x.resource)}</span></div>`).join('')||'No audit events';const pr=await fetch(`${API}/api/v1/orchestration/plan`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(m)});if(!pr.ok)throw Error('plan');const p=await pr.json();$('plan').innerHTML=`<div class="event"><b>PLAN STATUS</b> · ${esc(p.status)}</div>`+(p.assignments||[]).map(x=>`<div class="agent"><div><b>${esc(x.agent_id)}</b><div class="reason">${esc(x.role)}</div></div><div>${esc(x.action)}<div class="reason">${esc(x.reason)}</div></div><div><span class="tag ${x.requires_approval?'pending':''}">${x.requires_approval?'APPROVAL REQUIRED':'READY'}</span></div></div>`).join('');$('error').textContent=''}catch(e){$('error').textContent='Unable to load mission detail.'}}load();setInterval(load,5000);</script></body></html>
