<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bennu OS — Execution Console</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#18273c,transparent 35%),#06080d}.wrap{max-width:1200px;margin:auto;padding:36px}.back{color:#8ea2bd;text-decoration:none;font-size:12px}.ey{font-size:10px;letter-spacing:2px;color:#62e6c8}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 0 28px}.head h1{margin:7px 0;font-size:32px}.live{font-size:10px;color:#62e6c8}.panel{background:#0b101a;border:1px solid #182131;border-radius:14px;padding:20px;margin-bottom:14px}.panel h2{font-size:11px;letter-spacing:1.5px;margin:0 0 15px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.row{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr;gap:10px;padding:13px 0;border-top:1px solid #182131;font-size:11px;align-items:center}.muted{color:#718096}.tag{display:inline-block;font-size:9px;padding:5px 8px;border:1px solid #286b5f;border-radius:99px;color:#62e6c8}.blocked{border-color:#6a3942;color:#ff9aa5}.log{font:11px ui-monospace,monospace;color:#a9b5c8;padding:8px 0;border-bottom:1px solid #141c29}.log b{color:#62e6c8}.empty{color:#3f4d61;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}@media(max-width:500px){.wrap{padding:20px}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="mission-board.html">← Mission Board</a><div class="head"><div><div class="ey">RUNTIME OPERATIONS</div><h1>Execution Console</h1></div><div class="live">● LIVE · 5s</div></div><div class="grid"><main><section class="panel"><h2>EXECUTIONS</h2><div class="row muted"><span>TASK</span><span>OPERATION</span><span>APPROVAL</span><span>STATUS</span></div><div id="exec"><div class="empty">Loading...</div></div></section></main><aside><section class="panel"><h2>RUNTIME POLICY</h2><div class="log"><b>APPROVAL</b> required for execution</div><div class="log"><b>ALLOW-LIST</b> enforced by sandbox</div><div class="log"><b>RBAC</b> checked at API boundary</div><div class="log"><b>AUDIT</b> recorded for operations</div></section><section class="panel"><h2>RECENT EVENTS</h2><div id="events" class="empty">Loading...</div></section></aside></div></div><script>const API=window.BENNU_API||'http://localhost:8000',TOKEN=window.BENNU_TOKEN||'bennu-admin-dev',H={Authorization:`Bearer ${TOKEN}`};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const [er,ar]=await Promise.all([fetch(`${API}/api/v1/executions`,{headers:H}),fetch(`${API}/api/v1/audit`,{headers:H})]);if(!er.ok)throw Error();const e=await er.json(),a=ar.ok?await ar.json():[],items=e.items||[];$('exec').innerHTML=items.length?items.map(x=>{const r=x.result||{};return `<div class="row"><span>${esc(x.task_id)}</span><span>${esc(x.operation)}</span><span>${x.approved?'approved':'pending'}</span><span class="tag ${r.status==='blocked'?'blocked':''}">${esc(r.status||'registered')}</span></div>`}).join(''):'<div class="empty">No executions</div>';$('events').innerHTML=a.slice(0,8).map(x=>`<div class="log"><b>${esc(x.action)}</b> · ${esc(x.actor)}<br><span class="muted">${esc(x.resource)}</span></div>`).join('')||'No events'}catch(e){$('exec').innerHTML='<div class="empty">Core offline ou API indisponível.</div>'}}load();setInterval(load,5000);</script></body></html>
