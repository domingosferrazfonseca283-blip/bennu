<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bennu OS — Agents</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#18273c,transparent 35%),#06080d}.wrap{max-width:1200px;margin:auto;padding:36px}.back{color:#8ea2bd;text-decoration:none;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 0 24px}.ey{font-size:10px;letter-spacing:2px;color:#62e6c8}.head h1{margin:7px 0;font-size:32px}.live{font-size:10px;color:#62e6c8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#0b101a;border:1px solid #182131;border-radius:14px;padding:18px}.role{font-size:9px;color:#62e6c8;letter-spacing:1.5px;text-transform:uppercase}.card h2{font-size:16px;margin:7px 0}.status{font-size:9px;color:#718096}.section{margin-top:16px;padding-top:14px;border-top:1px solid #182131}.section h3{font-size:9px;letter-spacing:1px;margin:0 0 8px}.pill{display:inline-block;border:1px solid #263244;border-radius:99px;padding:5px 7px;margin:2px;font-size:9px;color:#a9b5c8}.empty{color:#3f4d61;font-size:11px}.error{color:#ff9aa5;font-size:11px;margin:10px 0}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.wrap{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="./">← Bennu Command Center</a><div class="head"><div><div class="ey">MULTI-AGENT OPERATIONS</div><h1>Agent Registry</h1></div><div class="live">● LIVE · 5s</div></div><div id="error" class="error"></div><div id="grid" class="grid"><div class="empty">Loading agents...</div></div></div><script>const API=window.BENNU_API||'http://localhost:8000',TOKEN=window.BENNU_TOKEN||'bennu-admin-dev',H={Authorization:`Bearer ${TOKEN}`},$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch(`${API}/api/v1/agents`,{headers:H});if(!r.ok)throw Error();const d=await r.json();$('grid').innerHTML=(d.items||[]).map(a=>`<article class="card"><div class="role">${esc(a.role)}</div><h2>${esc(a.name)}</h2><div class="status">● ${esc(a.status)} · ${esc(a.agent_id)}</div><div class="section"><h3>CAPABILITIES</h3>${a.capabilities.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="section"><h3>PERMISSIONS</h3>${a.permissions.length?a.permissions.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="status">Approval required</span>'}</div></article>`).join('')||'<div class="empty">No agents registered.</div>';$('error').textContent=''}catch(e){$('error').textContent='Agent API offline ou indisponível.'}}load();setInterval(load,5000);</script></body></html>
