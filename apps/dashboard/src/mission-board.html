<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bennu OS — Mission Board</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#06080d;color:#e8edf7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#18273c,transparent 35%),#06080d}.wrap{max-width:1250px;margin:auto;padding:36px}.back{color:#8ea2bd;text-decoration:none;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 0 28px}.ey{font-size:10px;letter-spacing:2px;color:#62e6c8}.head h1{margin:7px 0;font-size:32px}.refresh{font-size:10px;color:#718096}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.col{background:#080d15;border:1px solid #182131;border-radius:14px;min-height:330px;padding:14px}.col h2{font-size:10px;letter-spacing:1.5px;margin:0 0 14px;color:#9eabc0}.mission{background:#0d1420;border:1px solid #223047;border-radius:10px;padding:14px;margin-bottom:10px}.mission strong{font-size:12px;display:block}.mission p{font-size:11px;color:#718096;line-height:1.5}.tag{display:inline-block;font-size:9px;padding:4px 7px;border-radius:99px;border:1px solid #286b5f;color:#62e6c8}.risk{border-color:#6a3942;color:#ff9aa5}.meta{display:flex;justify-content:space-between;margin-top:12px;color:#66758b;font-size:9px}.empty{color:#3f4d61;font-size:11px;padding:15px 2px}.error{color:#ff9aa5;font-size:11px;margin:10px 0}.panel{margin-top:14px;background:#0b101a;border:1px solid #182131;border-radius:14px;padding:20px}.panel h2{font-size:12px;letter-spacing:1.5px;margin:0 0 14px}.flow{display:flex;justify-content:space-between;align-items:center;color:#718096;font-size:11px}.node{padding:12px;border:1px solid #263244;border-radius:9px;background:#0d1420}.node.active{border-color:#286b5f;color:#62e6c8}@media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.wrap{padding:20px}.board{grid-template-columns:1fr}.flow{flex-wrap:wrap;gap:8px}}</style></head><body><div class="wrap"><a class="back" href="./">← Bennu Command Center</a><div class="head"><div><div class="ey">MISSION OPERATIONS</div><h1>Mission Board</h1></div><div class="refresh">LIVE · REFRESH 5s</div></div><div id="error" class="error"></div><section class="board" id="board"></section><section class="panel"><h2>MISSION LIFECYCLE</h2><div class="flow"><span class="node active">PLAN</span><span>→</span><span class="node">POLICY</span><span>→</span><span class="node">APPROVAL</span><span>→</span><span class="node">SANDBOX</span><span>→</span><span class="node">EXECUTE</span><span>→</span><span class="node">AUDIT</span></div></section></div><script>const API=window.BENNU_API||'http://localhost:8000',TOKEN=window.BENNU_TOKEN||'bennu-admin-dev',H={Authorization:`Bearer ${TOKEN}`,'Content-Type':'application/json'},columns=[['planned','PLANNED'],['approval-required','APPROVAL'],['running','RUNNING'],['completed','COMPLETED'],['failed','FAILED']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch(`${API}/api/v1/missions`,{headers:H});if(!r.ok)throw Error();const data=await r.json(),items=data.items||[];$('board').innerHTML=columns.map(([status,title])=>`<div class="col"><h2>${title}</h2>${items.filter(m=>m.status===status).map(m=>`<div class="mission"><strong>${esc(m.objective)}</strong><p>${m.tasks?.length||0} tasks · ${esc(m.id)}</p><span class="tag ${m.tasks?.some(t=>t.risk==='high')?'risk':''}">${esc(m.status)}</span><div class="meta"><span>${m.tasks?.map(t=>esc(t.agent_role)).filter((v,i,a)=>a.indexOf(v)===i).join(', ')||'unassigned'}</span><span>${m.tasks?.length?Math.round((m.tasks.filter(t=>t.status==='completed').length/m.tasks.length)*100):0}%</span></div></div>`).join('')||'<div class="empty">No missions</div>'}</div>`).join('');$('error').textContent=''}catch(e){$('error').textContent='Core offline ou API indisponível.'}}function $(id){return document.getElementById(id)}load();setInterval(load,5000);</script></body></html>
