services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bennu
      POSTGRES_USER: bennu
      POSTGRES_PASSWORD: change-me-in-development
    ports:
      - "5432:5432"
    volumes:
      - bennu_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  bennu_postgres:
